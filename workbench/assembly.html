<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的课件 · 活页 LivePage</title><link rel="stylesheet" href="assembly.css"></head><body><header><a href="atom-pages/index.html">← 活页库</a><strong>备课组装</strong><a href="preparation.html">从授课意图开始 →</a><button id="new">新建</button></header><main><section id="course-start"><h2>母课程</h2><p>从原课件开始打磨，或派生这次授课的版本。</p><div id="courses" class="course-list"></div></section><div class="heading"><h1>把页面组成一堂课</h1><p>拖动缩略图调整顺序，保存为自己的课件。</p></div><div class="topbar"><label>已保存的课件 <select id="saved"><option value="">选择课件</option></select></label><button id="save" class="primary">保存课件</button><button id="preview">预览</button><button id="continue">添加活页</button><button id="derive" hidden>派生本次备课</button></div><label class="field">课件名称<input id="title" placeholder="例如：AI 时代的组织变革 · 管理者课程" maxlength="200"></label><details id="course-options"><summary>课程归属（选填）</summary><input id="course" placeholder="课程名称" maxlength="200"></details><details id="agent-panel"><summary>让 Agent 帮我备课</summary><p>说清楚听众、目标和思路，先查看组装方案，再决定是否应用。</p><div class="intent-fields"><label>听众<input id="audience" placeholder="例如企业管理者"></label><label>时长（分钟）<input id="duration" type="number" min="5" max="1440" value="90"></label></div><div class="intent-fields"><label>最少页数（可选）<input id="min-pages" type="number" min="1" max="3000" placeholder="不限"></label><label>最多页数（可选）<input id="max-pages" type="number" min="1" max="3000" placeholder="不限"></label></div><label>这堂课想达到什么目的<input id="goal" placeholder="例如理解 AI 对组织的影响"></label><label>我的思路<textarea id="thoughts" rows="4" placeholder="想强调什么、希望用哪些案例、哪些内容少讲……"></textarea></label><button id="generate" class="primary">生成组装方案</button><p id="agent-status" role="status"></p><div id="proposal"></div></details><p id="status" role="status" aria-live="polite"></p><div id="empty" hidden>还没有页面。<a href="atom-pages/index.html">回到活页库选页</a>，再开始组装。</div><div class="workspace"><aside class="sequence"><h2>页面顺序 <small>拖动调整 · Alt + ↑↓</small></h2><ol id="rows"></ol></aside><section id="page-editor"><div id="editor-picture"></div><h2 id="editor-title">选择一页查看与修改</h2><label>所属章节<input id="chapter" placeholder="例如：认知变化"></label><label>这次授课的讲解备注<textarea id="notes" rows="7" placeholder="这次怎么讲、如何过渡、案例和时间安排……"></textarea></label><div class="editor-actions"><button id="duplicate">重复引用此页</button><button id="remove-page">移出课件</button><button id="undo">撤销最近操作</button></div></section></div><details id="history-box"><summary>保存历史</summary><div id="history">保存后可查看历史。</div></details></main><dialog id="player"><button id="close" aria-label="关闭预览">×</button><p id="preview-title"></p><div id="preview-image"></div><div class="player-controls"><button id="prev">上一页</button><span id="position"></span><button id="next">下一页</button></div><p class="hint">按已保存的素材链接预览；远程原图可用性取决于来源，尚未归档的图片不保证历史画面不变。</p></dialog><script src="assembly-drag.js"></script><script src="assembly.js"></script><script src="prep-ui.js"></script></body></html>
