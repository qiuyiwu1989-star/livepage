<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活页 · 单页编辑闭环</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8f3;color:#24201b;font:15px system-ui}header{padding:20px 28px;border-bottom:1px solid #ded6cb}h1{font-size:24px;margin:0 0 8px}main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding:24px}iframe{width:100%;aspect-ratio:16/9;border:1px solid #ddd;background:#fff}aside{background:#fff;padding:18px;border:1px solid #ded6cb;border-radius:12px}label{display:block;margin:14px 0 5px}textarea,input,select,button{font:inherit;padding:9px;border:1px solid #cfc6b8;border-radius:6px}textarea,select,input{width:100%}button{background:#fff;cursor:pointer;margin-top:12px}button.primary{background:#88432f;color:white}button:disabled{opacity:.5;cursor:wait}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}#status{white-space:pre-wrap;line-height:1.6}#history a{display:block;margin:8px 0;color:#88432f}p{line-height:1.6}.muted{color:#746a60;font-size:13px}@media(max-width:800px){main{grid-template-columns:1fr;padding:12px}}</style>
<header><h1>活页 · 单页编辑闭环</h1><div id="identity"></div><p class="muted">本地隔离样本库 · 原始制品保留 · 每次保存追加版本 · AI 修改待人工确认</p></header><main><section><iframe id="preview" sandbox=""></iframe><p id="status" role="status"></p><h2>已保存版本</h2><div id="history"></div></section><aside><h2>自然语言修改</h2><label for="intent">给 Agent 的修改要求</label><textarea id="intent" rows="4" placeholder="例如：把氛围改为氛围与感受，其他文字不变"></textarea><button id="request">生成 Agent 任务</button><p class="muted">试跑由 Codex 执行，或派发到 MiMo Harness；提案返回后可查看并保存。尚未自动连接 Harness。</p><pre id="proposal" style="white-space:pre-wrap"></pre><button id="apply" disabled>应用 Agent 提案并保存新版本</button><hr><h2>工作台精调</h2><label for="object">文字对象</label><select id="object"></select><label for="text">文字</label><textarea id="text" rows="3"></textarea><div class="row"><div><label for="size">字号（源画布 px）</label><input id="size" type="number" min="6" max="300"></div><div><label for="color">颜色</label><input id="color" type="color"></div></div><div class="row"><div><label for="x">左侧位置 px</label><input id="x" type="number"></div><div><label for="y">顶部位置 px</label><input id="y" type="number"></div></div><button class="primary" id="save">保存工作台修改为新版本</button><button id="reload">从样本库重新读取</button></aside></main><script>
const $=id=>document.getElementById(id);let state,job,timer;
async function api(url,body){const r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const value=await r.json();if(!r.ok)throw new Error(value.error||'操作失败');return value}
function message(t){$('status').textContent=t}
function select(){const o=state.objects.find(o=>o.object_id===$('object').value);$('text').value=o.text;$('size').value=o.font_size??o.layout.size;$('color').value=o.color??'#'+o.layout.color.toString(16).padStart(6,'0');$('x').value=o.x;$('y').value=o.y}
async function load(){const selected=$('object').value;state=await api('/api/state');$('identity').textContent=state.atom_id+' · 本地版本 '+state.revision+' · '+state.version_id;$('preview').src='/preview/'+state.revision;$('object').replaceChildren();for(const o of state.objects){const option=document.createElement('option');option.value=o.object_id;option.textContent=o.text;$('object').append(option)}if(state.objects.some(o=>o.object_id===selected))$('object').value=selected;select();$('history').replaceChildren();for(const v of state.history){const a=document.createElement('a');a.href='/preview/'+v.revision;a.target='_blank';a.rel='noopener';a.textContent='版本 '+v.revision+' · '+(v.provenance?.kind||'source_baseline');$('history').append(a)}}
$('object').onchange=select;$('reload').onclick=()=>load().then(()=>message('已从磁盘版本库重新读取')).catch(e=>message(e.message));
$('save').onclick=async()=>{try{const result=await api('/api/save',{base_version_id:state.version_id,operations:[{object_id:$('object').value,text:$('text').value,font_size:Number($('size').value),color:$('color').value,x:Number($('x').value),y:Number($('y').value)}]});await load();message('工作台修改已保存为版本 '+result.revision+'；旧版本保留')}catch(e){message(e.message)}};
$('request').onclick=async()=>{try{const r=await api('/api/agent-jobs',{base_version_id:state.version_id,intent:$('intent').value});job=r.job_id;message('任务 '+job+' 已落盘，等待 Codex 或 Harness 执行');$('apply').disabled=true;clearInterval(timer);timer=setInterval(async()=>{try{const r=await api('/api/agent-jobs/'+job);if(r.operations){clearInterval(timer);$('proposal').textContent=JSON.stringify(r.operations,null,2);$('apply').disabled=false;message('Agent 提案已返回，可检查并保存为新版本')}}catch(e){clearInterval(timer);message(e.message)}},2000)}catch(e){message(e.message)}};
$('apply').onclick=async()=>{try{const r=await api('/api/save',{base_version_id:state.version_id,job_id:job});await load();$('apply').disabled=true;message('Agent 提案已保存为版本 '+r.revision+'，可继续工作台精调')}catch(e){message(e.message)}};
load().catch(e=>message(e.message));
</script></html>
